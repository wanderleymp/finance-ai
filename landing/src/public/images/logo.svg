<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Circuito Neural + Gráfico Ascendente -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056B3" />
      <stop offset="100%" stop-color="#007BFF" />
    </linearGradient>
  </defs>
  
  <!-- Circuito Neural Base -->
  <path d="M30 15 L40 10 L50 15 L60 10 L70 15" stroke="url(#logoGradient)" stroke-width="2" fill="none" />
  
  <!-- Gráfico Ascendente -->
  <path d="M10 40 L20 35 L30 30 L40 25 L50 20" stroke="url(#logoGradient)" stroke-width="3" fill="none" />
  
  <!-- Pontos de Conexão -->
  <circle cx="10" cy="40" r="3" fill="#B3D7FF" />
  <circle cx="20" cy="35" r="3" fill="#B3D7FF" />
  <circle cx="30" cy="30" r="3" fill="#B3D7FF" />
  <circle cx="40" cy="25" r="3" fill="#B3D7FF" />
  <circle cx="50" cy="20" r="3" fill="#B3D7FF" />
  
  <!-- Nós do Circuito -->
  <circle cx="30" cy="15" r="2" fill="#B3D7FF" />
  <circle cx="40" cy="10" r="2" fill="#B3D7FF" />
  <circle cx="50" cy="15" r="2" fill="#B3D7FF" />
  <circle cx="60" cy="10" r="2" fill="#B3D7FF" />
  <circle cx="70" cy="15" r="2" fill="#B3D7FF" />
  
  <!-- Conexões Adicionais -->
  <path d="M30 15 L30 30" stroke="#B3D7FF" stroke-width="1.5" stroke-dasharray="2,2" />
  <path d="M50 15 L50 20" stroke="#B3D7FF" stroke-width="1.5" stroke-dasharray="2,2" />
  
  <!-- Texto "Finance AI" -->
  <text x="85" y="35" font-family="Montserrat, sans-serif" font-size="22" font-weight="700" fill="#0056B3">Finance AI</text>
</svg>
